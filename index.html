<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>SyncPlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{
  --bg:#0d0f14; --panel:#161a22; --panel2:#1e2330; --line:#2a3040;
  --fg:#eef1f7; --mut:#8b93a7; --acc:#4fd1c5; --acc2:#f6ad55; --bad:#fc8181;
  --r:14px; --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --disp:'Space Grotesk','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top,0) max(14px,env(safe-area-inset-right,0)) env(safe-area-inset-bottom,0) max(14px,env(safe-area-inset-left,0))}
.wrap{max-width:980px;margin:0 auto;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:-.02em}
.logo b{color:var(--acc)}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:var(--mut);font:600 13px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--panel2);color:var(--fg)}
.load{display:flex;gap:8px}
.inbox{position:relative;flex:1;min-width:0;display:flex}
.inbox input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--fg);font:15px var(--body);padding:13px 74px 13px 14px;border-radius:var(--r);outline:none}
.inbox input:focus{border-color:var(--acc)}
.paste{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:600 12px var(--body);padding:7px 10px;border-radius:9px;cursor:pointer}
.btn{border:0;background:var(--acc);color:#06201d;font:700 15px var(--body);padding:0 18px;border-radius:var(--r);cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.filebox label{display:flex;align-items:center;justify-content:center;min-height:48px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--mut);cursor:pointer;font-weight:600;padding:8px;text-align:center}
.filebox input{display:none}

.stage{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;width:100%}
.stage iframe,.stage video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font:600 16px var(--body)}
.vtitle{font:600 15px var(--body);line-height:1.35;margin:-4px 2px 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.ptop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ptop h2{margin:0 0 4px;font:700 13px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.big{display:flex;align-items:baseline;gap:4px}
.big input{width:4.2ch;background:none;border:0;border-bottom:2px solid transparent;color:var(--fg);font:700 44px/1 var(--disp);font-variant-numeric:tabular-nums;padding:0;outline:none;-moz-appearance:textfield}
.big input:focus{border-bottom-color:var(--acc)}
.big input::-webkit-inner-spin-button,.big input::-webkit-outer-spin-button{-webkit-appearance:none}
.big small{font-size:18px;color:var(--mut)}
.status{font-size:12.5px;color:var(--mut);display:flex;gap:8px;align-items:center}
.pill{padding:3px 10px;border-radius:999px;background:var(--panel2);font-weight:600}
.pill.ok{color:var(--acc)} .pill.warn{color:var(--acc2)} .pill.bad{color:var(--bad)}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:26px;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:var(--line)}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--acc);margin-top:-7.5px;border:3px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--acc);border:3px solid var(--bg)}
.ticks{display:flex;justify-content:space-between;font:500 11px var(--body);color:var(--mut);font-variant-numeric:tabular-nums;margin-top:-2px}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.steps button,.presets button{border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:700 14px var(--body);padding:11px 0;border-radius:10px;cursor:pointer;font-variant-numeric:tabular-nums}
.steps button:active,.presets button:active{transform:scale(.96)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{padding:8px 12px;font-size:13px;font-weight:600}
.presets button.on{border-color:var(--acc);color:var(--acc)}
.volrow{display:flex;align-items:center;gap:10px;font:600 13px var(--body);color:var(--mut)}
.volrow input{flex:1}
.hint{font-size:12.5px;color:var(--mut)}
.hint b{color:var(--fg)}
.unlock{display:none;background:#2a2210;border:1px solid #6b5520;color:#f6d38b;border-radius:var(--r);padding:12px;font-size:13.5px;gap:10px;flex-direction:column}
.unlock.show{display:flex}
.unlock .ah{width:240px;max-width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
#audioHost{position:fixed;left:0;bottom:0;width:220px;height:124px;opacity:.01;pointer-events:none;z-index:-1;overflow:hidden}
#audioHost.reveal{position:static;opacity:1;pointer-events:auto;z-index:auto;width:100%;height:100%}
#audioHost iframe{width:100%;height:100%;border:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:560px){ .big input{font-size:36px} .steps button{font-size:13px;padding:10px 0} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Sync<b>Play</b></div>
    <div class="tabs">
      <button id="tabYt" class="on">YouTube</button>
      <button id="tabFile">File</button>
    </div>
  </header>

  <form class="load" id="ytForm">
    <div class="inbox"><input type="text" id="ytUrl" placeholder="YouTube or video link" autocomplete="off" inputmode="url" enterkeyhint="go">
    <button class="paste" id="pasteBtn" type="button">Paste</button></div>
    <button class="btn" type="submit">Load</button>
  </form>
  <div class="filebox" id="fileForm" hidden>
    <label for="fileIn" id="fileLbl">Choose video file</label>
    <input type="file" id="fileIn" accept="video/*,.mkv">
  </div>

  <div class="stage" id="stage">
    <div class="empty" id="empty">Paste a link to start</div>
    <div id="vidHost"></div>
    <video id="fv" playsinline controls muted hidden></video>
  </div>
  <div class="vtitle" id="vtitle" hidden></div>

  <div class="unlock" id="unlock">
    <div><b>Enable sound:</b> tap ▶ on this small player once.</div>
    <div class="ah" id="audioSlot"></div>
    <button class="btn ghost" id="unlockDone" type="button" style="min-height:40px">Done</button>
  </div>

  <section class="panel" aria-label="Audio delay">
    <div class="ptop">
      <div>
        <h2>Audio Delay</h2>
        <label class="big"><input type="number" id="dNum" step="0.1" value="0" inputmode="decimal" aria-label="Delay in seconds"><small>sec</small></label>
      </div>
      <div class="status"><span class="pill" id="syncPill">Idle</span><span id="driftTxt"></span></div>
    </div>
    <div>
      <input type="range" id="dSlider" min="-60" max="60" step="0.1" value="0" aria-label="Audio delay">
      <div class="ticks"><span>−60</span><span>−30</span><span>0</span><span>+30</span><span>+60</span></div>
    </div>
    <div class="steps">
      <button data-d="-1">−1s</button><button data-d="-0.5">−0.5</button><button data-d="-0.1">−0.1</button>
      <button data-d="0.1">+0.1</button><button data-d="0.5">+0.5</button><button data-d="1">+1s</button>
    </div>
    <div class="presets" id="presets">
      <button data-v="0">Reset</button><button data-v="5">+5s</button><button data-v="10">+10s</button><button data-v="15">+15s</button><button data-v="20">+20s</button><button data-v="30">+30s</button><button data-v="-5">−5s</button><button data-v="-10">−10s</button>
    </div>
    <div class="volrow"><span>Volume</span><input type="range" id="vol" min="0" max="100" value="100" aria-label="Volume"></div>
    <div class="hint"><b>+</b> audio later &nbsp;·&nbsp; <b>−</b> audio earlier</div>
  </section>
</div>

<div id="audioHost"><div id="audHost"></div></div>
<video id="fa" playsinline hidden></video>

<script>
(() => {
const $ = id => document.getElementById(id);
const MAX=600;
let mode='yt', delay=0, vidKey='', volume=100;
let vp=null, ap=null, vReady=false, aReady=false, apiReady=false, pendingId=null;
let audioOk=false, holdingForAudio=false, lastSeekAt=0, blockedSince=0;
const fv=$('fv'), fa=$('fa');

const parseId=u=>{ u=(u||'').trim(); if(/^[\w-]{11}$/.test(u)) return u;
  const m=u.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/|\/v\/)([\w-]{11})/); return m?m[1]:null; };
const store={ get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

/* ---------- delay ---------- */
let rsT;
function setDelay(v, save=true){
  v=+v; if(!isFinite(v)) v=0;
  v=Math.max(-MAX,Math.min(MAX,Math.round(v*10)/10)); delay=v;
  if(document.activeElement!==$('dNum')) $('dNum').value=(v>0?'+':'')+v.toFixed(1);
  $('dSlider').value=Math.max(-60,Math.min(60,v));
  document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('on',+b.dataset.v===v));
  if(save){ store.set('sp_last',v); if(vidKey) store.set('sp_d_'+vidKey,v); }
  updateUrl(); clearTimeout(rsT); rsT=setTimeout(()=>{lastSeekAt=0; tick(true);},250);
}
function updateUrl(){
  if(mode!=='yt'||!vidKey) return;
  const p=new URLSearchParams(); p.set('v',vidKey); if(delay) p.set('d',delay);
  try{ history.replaceState(null,'','?'+p); }catch(e){}
}

/* ---------- YouTube ---------- */
window.onYouTubeIframeAPIReady=()=>{ apiReady=true; if(pendingId) loadYt(pendingId); };
function ensureApi(){ if($('ytapi')) return; const s=document.createElement('script'); s.id='ytapi'; s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s); }

function loadYt(id){
  if(!apiReady){ pendingId=id; ensureApi(); return; }
  pendingId=null; stopFile(); mode='yt'; vidKey=id; audioOk=false; holdingForAudio=false;
  $('empty').hidden=true; $('vtitle').hidden=true;
  const saved=store.get('sp_d_'+id); setDelay(saved!==null?+saved:delay,false); updateUrl();
  if(vp){ vp.cueVideoById(id); ap.cueVideoById(id); setTimeout(showTitle,1500); return; }
  const base={playsinline:1,rel:0,iv_load_policy:3,origin:location.origin};
  vp=new YT.Player('vidHost',{videoId:id,playerVars:Object.assign({controls:1,fs:1},base),events:{
    onReady:()=>{vReady=true; vp.mute(); showTitle();},
    onStateChange:e=>{ if(e.data===1||e.data===5) showTitle(); tick(true); },
    onPlaybackRateChange:e=>{ aReady&&ap.setPlaybackRate(e.data); }
  }});
  ap=new YT.Player('audHost',{videoId:id,width:220,height:124,playerVars:Object.assign({controls:1,fs:0,disablekb:1},base),events:{
    onReady:()=>{aReady=true; ap.setVolume(volume); ap.unMute();},
    onStateChange:e=>{ if(e.data===1){ audioOk=true; hideUnlock(); } }
  }});
}
function showTitle(name){
  let t=name; if(!t&&vp&&vp.getVideoData){ try{t=vp.getVideoData().title}catch(e){} }
  $('vtitle').textContent=t||''; $('vtitle').hidden=!t; document.title=t?t+' · SyncPlay':'SyncPlay';
}

/* ---------- File ---------- */
function stopFile(){ fv.pause(); fa.pause(); fv.hidden=true; }
function loadFile(src,name){
  mode='file'; vidKey='';
  if(vReady){ vp.pauseVideo(); ap.pauseVideo(); }
  $('vidHost').hidden=true; const ifr=document.querySelector('#stage iframe'); if(ifr) ifr.hidden=true;
  $('empty').hidden=true; fv.hidden=false; fv.src=src; fa.src=src; fv.muted=true; fa.volume=volume/100;
  showTitle(name||'');
}

/* ---------- sync: the visible player is the master, the audio player follows ---------- */
function tick(force){
  let state='Idle', cls='', drift=null;
  if(mode==='yt'){
    if(!vReady||!aReady) return;
    const ifr=document.querySelector('#stage iframe'); if(ifr) ifr.hidden=false;
    // keep picture muted; if user unmutes it, treat that as audio volume
    if(!vp.isMuted()){ volume=vp.getVolume()||volume; $('vol').value=volume; ap.setVolume(volume); ap.unMute(); vp.mute(); }
    const vs=vp.getPlayerState(), as=ap.getPlayerState();
    const T=vp.getCurrentTime(), D=vp.getDuration(), tgt=T-delay;
    const vPlaying = vs===1 || (vs===3) || holdingForAudio;
    if(vp.getPlaybackRate()!==ap.getPlaybackRate()) ap.setPlaybackRate(vp.getPlaybackRate());
    if(!vPlaying){
      if(as===1||as===3) ap.pauseVideo();
      // still align while paused so play starts in sync
      if(force && tgt>=0 && tgt<D) ap.seekTo(tgt,true);
      state='Paused';
    } else if(tgt<0 || (D && tgt>=D)){
      if(as===1) ap.pauseVideo();
      if(holdingForAudio){ holdingForAudio=false; vp.playVideo(); }
      state= tgt<0 ? 'Audio starts in '+(-tgt).toFixed(0)+'s' : 'Audio ended'; cls='warn';
    } else if(vs===3){
      if(as===1) ap.pauseVideo(); state='Loading video'; cls='warn';
    } else {
      if(as===3 && vs===1 && !holdingForAudio){ vp.pauseVideo(); holdingForAudio=true; }
      if(holdingForAudio && as===1){ holdingForAudio=false; vp.playVideo(); }
      if(as!==1 && as!==3){ ap.seekTo(tgt,true); ap.playVideo(); }
      else if(as===1){
        drift=ap.getCurrentTime()-tgt; const now=performance.now();
        if((Math.abs(drift)>0.3||force) && now-lastSeekAt>1500){ ap.seekTo(tgt+0.08,true); lastSeekAt=now; }
      }
      if(as===1){ state='Synced'; cls='ok'; } else { state='Loading audio'; cls='warn'; }
      if(!audioOk && as!==1 && as!==3){
        blockedSince=blockedSince||performance.now();
        if(performance.now()-blockedSince>2500){ state='Sound blocked'; cls='bad'; showUnlock(); }
      } else blockedSince=0;
    }
  } else {
    if(!fv.src) return;
    if(!fv.muted){ volume=Math.round(fv.volume*100); $('vol').value=volume; fa.volume=fv.volume; fv.muted=true; }
    const T=fv.currentTime, D=fv.duration||0, tgt=T-delay;
    fa.playbackRate=fv.playbackRate;
    if(fv.paused){ if(!fa.paused) fa.pause(); if(force&&tgt>=0) fa.currentTime=tgt; state='Paused'; }
    else if(tgt<0||(D&&tgt>=D)){ if(!fa.paused) fa.pause(); state=tgt<0?'Audio starts in '+(-tgt).toFixed(0)+'s':'Audio ended'; cls='warn'; }
    else{
      if(fa.paused){ fa.currentTime=tgt; fa.play().catch(()=>{ state='Sound blocked'; }); }
      drift=fa.currentTime-tgt;
      if(Math.abs(drift)>0.15||force){ fa.currentTime=tgt; }
      state='Synced'; cls='ok';
    }
  }
  $('syncPill').textContent=state; $('syncPill').className='pill '+cls;
  $('driftTxt').textContent= drift!==null ? Math.round(Math.abs(drift)*1000)+' ms' : '';
}
setInterval(()=>tick(false),300);
['play','pause','seeked','ratechange','volumechange'].forEach(ev=>fv.addEventListener(ev,()=>tick(true)));

/* ---------- unlock (phones block sound until a tap) ---------- */
const audioHost=$('audioHost');
function showUnlock(){ if($('unlock').classList.contains('show')) return; $('unlock').classList.add('show'); $('audioSlot').appendChild(audioHost); audioHost.classList.add('reveal'); }
function hideUnlock(){ if(!$('unlock').classList.contains('show')) return; $('unlock').classList.remove('show'); audioHost.classList.remove('reveal'); document.body.appendChild(audioHost); }
$('unlockDone').onclick=()=>{ audioOk=true; hideUnlock(); tick(true); };

/* ---------- controls ---------- */
$('dSlider').addEventListener('input',e=>setDelay(e.target.value));
$('dNum').addEventListener('change',e=>{ setDelay(e.target.value); e.target.blur(); });
$('dNum').addEventListener('blur',()=>setDelay(delay,false));
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>setDelay(delay + +b.dataset.d));
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setDelay(+b.dataset.v));
$('vol').oninput=e=>{ volume=+e.target.value; if(aReady){ap.setVolume(volume); ap.unMute();} fa.volume=volume/100; };

function setTab(t){
  $('tabYt').classList.toggle('on',t==='yt'); $('tabFile').classList.toggle('on',t==='file');
  $('ytForm').hidden=t!=='yt'; $('fileForm').hidden=t!=='file';
}
$('tabYt').onclick=()=>setTab('yt'); $('tabFile').onclick=()=>setTab('file');

$('ytForm').addEventListener('submit',e=>{
  e.preventDefault(); const raw=$('ytUrl').value.trim(); const id=parseId(raw);
  if(id){ loadYt(id); }
  else if(/^https?:\/\//.test(raw)){ loadFile(raw,raw.split('/').pop()); }
  else { $('ytUrl').value=''; $('ytUrl').placeholder='Invalid link'; return; }
  $('ytUrl').blur(); $('stage').scrollIntoView({behavior:'smooth',block:'nearest'});
});
$('pasteBtn').onclick=async()=>{
  try{ const t=await navigator.clipboard.readText(); if(t){ $('ytUrl').value=t.trim(); $('ytForm').requestSubmit(); return; } }catch(e){}
  $('ytUrl').focus();
};
$('ytUrl').addEventListener('paste',()=>setTimeout(()=>{ if(parseId($('ytUrl').value)) $('ytForm').requestSubmit(); },0));
$('fileIn').onchange=e=>{ const f=e.target.files[0]; if(!f) return; $('fileLbl').textContent=f.name; loadFile(URL.createObjectURL(f),f.name); };

/* keyboard: [ ] fine tune, { } 1s (when focus is not inside the YouTube player) */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&(e.target.type==='text'||e.target.type==='number')) return;
  if(e.key==='[') setDelay(delay-0.1); else if(e.key===']') setDelay(delay+0.1);
  else if(e.key==='{') setDelay(delay-1); else if(e.key==='}') setDelay(delay+1);
});

/* init */
const q=new URLSearchParams(location.search); const last=store.get('sp_last');
setDelay(q.has('d')?+q.get('d'):(last!==null?+last:0),false);
const qid=parseId(q.get('v')||''); if(qid){ $('ytUrl').value='https://youtu.be/'+qid; loadYt(qid); }
ensureApi();
})();
</script>
</body>
</html>
